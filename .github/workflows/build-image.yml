name: Build SD card image

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    # Native ARM runner: no QEMU emulation needed, and much faster builds.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      # pi-gen only sees the stage directory, so the app source must be
      # inside it before the build starts.
      - name: Copy application into build stage
        run: |
          rm -rf image/stage-trio/00-trio-monitor/files/trio_monitor
          cp -r trio_monitor image/stage-trio/00-trio-monitor/files/
          find image/stage-trio -name __pycache__ -type d -exec rm -rf {} +

      - name: Build Raspberry Pi OS image with pi-gen
        id: build
        uses: usimd/pi-gen-action@v1
        with:
          image-name: trio-monitor
          # stage2 = Raspberry Pi OS Lite (no desktop), then our stage on top
          stage-list: stage0 stage1 stage2 ./image/stage-trio
          release: trixie
          hostname: trio-monitor
          username: trio
          password: "triomonitor"
          disable-first-boot-user-rename: 1
          enable-ssh: 1
          compression: xz
          compression-level: 9
          verbose-output: true

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: trio-monitor-image
          path: ${{ steps.build.outputs.image-path }}

      - name: Attach image to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.image-path }}
