name: Build SD card image

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Registers qemu-aarch64 with the fix-binary flag so ARM binaries run
      # inside pi-gen's build container on the x86 runner.
      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build Raspberry Pi OS image with pi-gen
        id: build
        uses: usimd/pi-gen-action@v1
        with:
          image-name: trio-monitor
          # stage2 = Raspberry Pi OS Lite (no desktop), then our stage on top
          stage-list: stage0 stage1 stage2 ./image/stage-trio
          release: bookworm
          hostname: trio-monitor
          username: trio
          password: "triomonitor"
          disable-first-boot-user-rename: 1
          enable-ssh: 1
          compression: xz
          verbose-output: true

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: trio-monitor-image
          path: ${{ steps.build.outputs.image-path }}

      - name: Attach image to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.image-path }}
